name: Daily Auto Content Update

on:
  schedule:
    # UTC 时间 17:00 运行（对应越南/北京时间 00:00 凌晨）
    - cron: '0 17 * * *'
  workflow_dispatch:

# 关键设置：赋予 GitHub Actions 提交代码回仓库的写权限
permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
    # 升级至 v4 解决 Node.js 警告
    - name: Check out repository
      uses: actions/checkout@v4

    # 升级至 v5 解决 Node.js 警告
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 步骤 1：运行 AI 扩充脚本
    - name: Run AI Dataset Builder
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        SITE_TYPE: ${{ vars.SITE_TYPE }}
      run: python build_dataset.py

    # 步骤 2：运行 SSG 编译脚本
    - name: Run SSG Compile Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        SITE_TYPE: ${{ vars.SITE_TYPE }}
        SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
      run: python script.py

    # 步骤 3：安全的 Git 提交逻辑（防 exit code 128）
    - name: Commit and Push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # 确保 detail 目录存在
        mkdir -p detail
        
        # 暂存所有新增/修改的文件
        git add data.json index.html sitemap.xml detail/
        
        # 检查是否有代码变动，如果有变动才执行 commit 和 push，防止提交空白引发 128 错误
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Auto expand AI dataset & SSG compile multi-pages"
          git push
        fi
