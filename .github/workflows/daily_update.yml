name: Daily Auto Content Update

on:
  schedule:
    # UTC 时间 17:00 运行（对应越南/北京时间 00:00 凌晨）
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Auto-Update Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        SITE_TYPE: ${{ secrets.SITE_TYPE }}
        SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
      run: python script.py

    - name: Commit and Push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add data.json sitemap.xml
        git diff-index --quiet HEAD || git commit -m "Auto update daily horoscope & sitemap"
        git push
